name: Validate statistical engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,report]"
      - name: Test mathematical and API invariants
        run: |
          python -m py_compile src/opensky_streaming_dpmm/*.py scripts/*.py tests/*.py
          python -m ruff check src scripts tests --select F,E9,B023
          python -m pytest
      - name: Run deterministic smoke benchmark
        run: python -m opensky_streaming_dpmm.engine
      - name: Rebuild publication artifacts
        run: |
          python scripts/build_site.py
          python scripts/build_report.py
          git diff --exit-code -- index.html report/OpenSky_Streaming_DPMM_APA_Report.pdf
      - name: Audit artifact boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader

          status = json.loads(Path("data/project_status.json").read_text())
          assert status["empirical_results_available"] is False
          assert status["authenticated_live_api_verified"] is True
          html = Path("index.html").read_text(encoding="utf-8")
          assert "No operational SIGINT claim" in html
          assert "Execution pipeline ready" in html
          assert "No public empirical summary before 600 unique successful rows" in html
          assert len(PdfReader("report/OpenSky_Streaming_DPMM_APA_Report.pdf").pages) == 26
          PY
